
spring:
  application:
    name: fran-bank

  # H2 Database
  datasource:
    url: jdbc:h2:mem:franbankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  security:
    refresh-cookie:
      name: franbank_refresh
      secure: false
      same-site: Strict
      path: /api/v1/auth
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

# Server
server:
  port: 8080

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never